<!DOCTYPE html>
<html lang="en">
<head>
    <title>Stock Return Calculator </title>
</head>
<body>
    <h1>Stock Return Calculator</h1>
    <p>Calculate your investment returns!</p>
    <h2>Enter your investment <details></details></h2>

    <label>Purchase Price ($):</label>
    <input type="number" id="buy">
    
    <label>Selling Price ($):</label>
    <input type="number" id="sell">

    <label>Number of shares:</label>
    <input type="number" id="shares">

    <button id="calculate">Calculate Returns</button>

    <!--display the results-->
    <h2>your results</h2>
    <p id="results"></p>enter numbers to see your return.</p>

    <!--java script-->
    <script>
        //calculations
            document.getElementById("calculate").onclick = function(){
                let buy = Number(document.getElementById("buy").value);
                let sell = Number(document.getElementById("sell").value);
                let shares = Number(document.getElementById("shares").value);

                if (buy <= 0 || sell <0 || shares <=0 ||
                    document.getElementById("buy").value === "" ||
                    document.getElementById("sell").value === "" ||
                    document.getElementById("shares").value === "") {
                    document.getElementById("results").innerText = "Please enter valid numbers.";
                    return;
            }
    </script>
</body>
</html>
