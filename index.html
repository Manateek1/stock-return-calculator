
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Return Calculator</title>

    
<style>
    body {
        font-family: Arial;
        background-color: lightgray;
        padding: 40px;
    }

    .calculator {
        background-color: white;
        padding: 20px;
        width: 400px;
        margin: auto;
        border-radius: 10px;
    }

    input {
        display: block;
        padding: 10px;
        margin-bottom: 15px;
        width: 90%;
    }

    button {
        background-color: blue;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
    }

    #results {
        margin-top: 20px;
        font-weight: bold;
    }
</style>

</head>

<body>
    <div class="calculator">
        <h1>Stock Return Calculator</h1>
        <p>Calculate your investment returns!</p>

        <h2>Enter Your Investment</h2>

        <label for="buy">Purchase Price ($):</label>
        <input type="number" id="buy" min="0" step="any">

        <label for="sell">Selling Price ($):</label>
        <input type="number" id="sell" min="0" step="any">

        <label for="shares">Number of Shares:</label>
        <input type="number" id="shares" min="0" step="any">

        <button id="calculate">Calculate Returns</button>

        <h2>Your Results</h2>
        <p id="results">Enter numbers to see your return.</p>
    </div>

   
<script>
    document.getElementById("calculate").onclick = function() {
        let buy = Number(document.getElementById("buy").value);
        let sell = Number(document.getElementById("sell").value);
        let shares = Number(document.getElementById("shares").value);

        if (buy <= 0 || sell < 0 || shares <= 0 ||
            document.getElementById("sell").value === "") {
            document.getElementById("results").innerText = "Please enter valid numbers.";
            return;
        }

        let investment = buy * shares;
        let finalValue = sell * shares;
        let profit = finalValue - investment;
        let percent = (profit / investment) * 100;

        document.getElementById("results").innerText =
            "Initial Investment: $" + investment.toFixed(2) +
            "\nFinal Value: $" + finalValue.toFixed(2) +
            "\nProfit/Loss: $" + profit.toFixed(2) +
            "\nReturn: " + percent.toFixed(2) + "%";
    };
</script>

</body>
</html>
